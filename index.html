<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manahil Tariq Malik – Contact</title>
<meta name="description" content="Save the contact details of Manahil Tariq Malik, MBBS – Dean's Clinical Research Fellow, Aga Khan University.">
<meta name="theme-color" content="#1f3a5f">
<style>
  :root{
    --navy:#1f3a5f; --navy-dark:#162b47; --muted:#5b6b80; --line:#e3e8ef; --bg:#f7f8fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; background:var(--bg); color:#1c2733;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:40px 28px 32px; text-align:center; box-shadow:0 1px 2px rgba(20,40,70,.04),0 8px 24px rgba(20,40,70,.06);
    border-top:4px solid var(--navy);
  }
  .mono{
    width:64px; height:64px; margin:0 auto 20px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,"Times New Roman",serif; font-size:24px; letter-spacing:.04em;
  }
  h1{
    margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:28px; line-height:1.2; color:var(--navy);
  }
  .degree{margin:6px 0 0; font-size:14px; letter-spacing:.12em; color:var(--muted)}
  .role{margin:22px 0 0; font-size:16px; font-weight:600; color:#1c2733}
  .org{margin:14px 0 0; font-size:15px; line-height:1.55; color:var(--muted)}
  .org strong{display:block; color:#1c2733; font-weight:600}
  hr{border:0; border-top:1px solid var(--line); margin:28px 0}
  .email{
    display:inline-block; font-size:16px; color:var(--navy); text-decoration:none; word-break:break-all;
    border-bottom:1px solid rgba(31,58,95,.35); padding-bottom:1px;
  }
  .email:hover{border-bottom-color:var(--navy)}
  .btn{
    display:block; width:100%; margin-top:28px; padding:16px 20px; border:0; border-radius:12px;
    background:var(--navy); color:#fff; font:inherit; font-size:17px; font-weight:600; letter-spacing:.01em;
    text-align:center; text-decoration:none; cursor:pointer; transition:background .15s;
  }
  .btn:hover,.btn:focus-visible{background:var(--navy-dark)}
  .btn:focus-visible,.email:focus-visible,.alt a:focus-visible{outline:3px solid #9db6d8; outline-offset:2px}
  .alt{margin:14px 0 0; font-size:13px; color:var(--muted)}
  .alt a{color:var(--navy)}
</style>
</head>
<body>
<main class="card">
  <div class="mono" aria-hidden="true">MM</div>
  <h1>Manahil Tariq Malik</h1>
  <p class="degree">MBBS</p>

  <p class="role">Dean's Clinical Research Fellow</p>
  <p class="org">
    <strong>Department of Ophthalmology &amp; Vision Sciences</strong>
    Aga Khan University, Pakistan
  </p>

  <hr>

  <a class="email" href="mailto:manahil.malik25@alumni.aku.edu">manahil.malik25@alumni.aku.edu</a>

  <a id="save" class="btn" href="Manahil_Tariq_Malik.vcf" download="Manahil_Tariq_Malik.vcf">Save My Contact</a>
  <p class="alt">Nothing downloading? <a href="Manahil_Tariq_Malik.vcf">Open the contact file directly</a>.</p>
</main>

<script>
(function () {
  // Same content as Manahil_Tariq_Malik.vcf (vCard 3.0, CRLF line endings)
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Malik;Manahil Tariq;;;MBBS",
    "FN:Manahil Tariq Malik",
    "ORG:Aga Khan University;Department of Ophthalmology & Vision Sciences",
    "TITLE:Dean's Clinical Research Fellow",
    "EMAIL;TYPE=INTERNET,WORK:manahil.malik25@alumni.aku.edu",
    "END:VCARD"
  ].join("\r\n") + "\r\n";

  var btn = document.getElementById("save");
  btn.addEventListener("click", function (e) {
    try {
      var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Manahil_Tariq_Malik.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      e.preventDefault();
    } catch (err) {
      /* fall through: the link's own href downloads the static .vcf */
    }
  });
})();
</script>
</body>
</html>
